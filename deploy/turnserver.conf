# coturn on a small EC2 instance (sudo apt install coturn). Copy to /etc/turnserver.conf, set ENABLED in /etc/default/coturn.
listen-port=3478
tls-listening-port=5349
# relay ports: open UDP 3478, TCP/UDP 5349 and UDP 49160-49200 in the security group
min-port=49160
max-port=49200

# short-lived credentials made by the Flask server (/api/rtc/ice); same secret as TURN_SECRET
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM
realm=turn.example.com

# the server's public address (needed on EC2, where the instance only sees its private address)
external-ip=PUBLIC_IP/PRIVATE_IP

# TLS (turns:) works through firewalls that only allow port 443/5349; get the certificate with certbot
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

fingerprint
no-multicast-peers
# never let a relay reach private networks (stops people using your TURN to probe your VPC)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
no-cli
# bandwidth guard: each user gets limited relay sessions and total relayed rate is capped (bytes/s)
user-quota=4
total-quota=100
max-bps=500000